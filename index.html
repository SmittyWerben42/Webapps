<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Webapps</title>
  <style>
    :root {
      color-scheme: light;
    }

    html {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.4), transparent),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.22), transparent),
        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.22), transparent),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.1), transparent),
        #f7fafc;
    }

    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1rem;
      color: #111;
    }

    h1 {
      margin-bottom: 2rem;
    }

    .kacheln {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .kachel {
      display: block;
      padding: 1.5rem;
      border: 2px solid #b8c4d4;
      border-radius: 8px;
      background: #fff;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      transition: box-shadow 0.15s ease;
    }

    .kachel:hover {
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.34);
    }

    .kachel h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
    }

    .kachel p {
      margin: 0;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Projekte</h1>

  <div class="kacheln">
    <a class="kachel" href="test-app/">
      <h2>Testapp</h2>
      <p>Beispielprojekt zum Testen des Workflows.</p>
    </a>
  </div>
</body>
</html>
